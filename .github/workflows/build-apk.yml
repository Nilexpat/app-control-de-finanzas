name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ANDROID_HOME: /opt/android-sdk
  ANDROID_SDK_ROOT: /opt/android-sdk

jobs:
  apk:
    name: Generar APK de debug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Se descarga el SDK oficial a mano en lugar de usar
      # android-actions/setup-android, que falla en los runners actuales.
      - name: Instalar el SDK de Android (cmdline-tools)
        run: |
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo chown -R "$USER":"$USER" /opt/android-sdk
          cd /tmp
          echo "Descargando command line tools..."
          curl -sSL -o cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          ls -lh cmdtools.zip
          unzip -q cmdtools.zip -d /tmp/cmdtools-extract
          mv /tmp/cmdtools-extract/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "SDK instalado en $ANDROID_HOME"

      - name: Aceptar licencias del SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --list_installed || true

      - name: Compilar el APK de debug
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          keytool -genkeypair -v \
            -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json creado desde el secreto."
          else
            echo "Sin secreto GOOGLE_SERVICES_JSON: la app compila, pero Firebase no funcionara."
          fi

          gradle assembleDebug --no-daemon --stacktrace

      - name: Localizar el APK generado
        if: always()
        run: find app/build/outputs -name "*.apk" -type f 2>/dev/null || echo "No se genero ningun APK"

      - name: Subir el APK como descargable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SocioFinanzas-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
